# ONE-OFF QA bootstrap (2026-11-15): api.neon.tech is unreachable from the
# operator sandbox, so this runner-based job discovers the production Neon
# URI at runtime and activates the QA reviewer account's PENDING subscription
# — scoped to a single hardcoded email, touches nothing else. Delete after use.
name: qa-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-bootstrap
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg client
        working-directory: ${{ runner.temp }}
        run: npm init -y >/dev/null 2>&1 && npm i pg@8 --silent >/dev/null 2>&1

      - name: Resolve Neon URI + activate QA subscription (scoped)
        working-directory: ${{ runner.temp }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          cat > qa.js <<'EOF'
          const { Client } = require("pg");
          const fs = require("fs");
          const KEY = process.env.NEON_API_KEY;
          const QA_EMAIL = "qa-review-1115@egxano-qa.local";
          const subId = process.env.QA_SUB_ID;

          const { execSync } = require("child_process");
          function jget(url) {
            const out = execSync(
              `curl -sS --max-time 20 -H "Authorization: Bearer ${KEY}" "${url}"`,
              { encoding: "utf8", stdio: ["pipe", "pipe", "pipe"] }
            );
            return JSON.parse(out);
          }
          // diagnostics: dump the raw projects payload (contains no credentials)
          try {
            const raw = execSync(
              `curl -sS --max-time 20 -H "Authorization: Bearer ${KEY}" "https://console.neon.tech/api/v2/projects"`,
              { encoding: "utf8", stdio: ["pipe", "pipe", "pipe"] }
            );
            console.log("RAW projects payload:", raw.slice(0, 900));
          } catch (e) {
            console.log("RAW projects curl failed:", String(e.stderr || e.message).slice(0, 300));
          }

          (async () => {
            // org-scoped account: resolve org ids first, then list per org
            let projects = { projects: [] };
            try {
              const orgs = await jget("https://console.neon.tech/api/v2/orgs");
              for (const o of orgs.orgs || []) {
                console.log("org:", o.id, o.name);
                try {
                  const pl = await jget(`https://console.neon.tech/api/v2/projects?org_id=${o.id}&limit=10`);
                  projects.projects.push(...(pl.projects || []));
                } catch (e) { console.log(`org ${o.id} projects list failed`); }
              }
            } catch {
              projects = await jget("https://console.neon.tech/api/v2/projects");
            }
            const uris = [];
            for (const p of projects.projects || []) {
              try {
                const uri = await jget(`https://console.neon.tech/api/v2/projects/${p.id}/connection_uri?pooled=true`);
                if (uri?.uri) uris.push({ name: p.name, uri: uri.uri });
              } catch (e) {
                try {
                  const b = await jget(`https://console.neon.tech/api/v2/projects/${p.id}/branches`);
                  for (const br of b.branches || []) {
                    try {
                      const u2 = await jget(`https://console.neon.tech/api/v2/projects/${p.id}/branches/${br.id}/connection_uri?pooled=true`);
                      if (u2?.uri) uris.push({ name: `${p.name}/${br.name}`, uri: u2.uri });
                    } catch {}
                  }
                } catch {}
              }
            }
            console.log(`neon candidates: ${uris.length}`);
            for (const { name, uri } of uris) {
              const c = new Client({ connectionString: uri, ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 8000 });
              try {
                await c.connect();
                const t = await c.query(`SELECT table_name FROM information_schema.tables WHERE table_name IN ('User','Subscription')`);
                if (t.rowCount < 2) { console.log(`${name}: no app tables`); await c.end(); continue; }
                console.log(`${name}: app tables found`);
                if (subId) {
                  const upd = await c.query(
                    `UPDATE "Subscription" SET status='ACTIVE', "startDate"=now(), "endDate"=now()+interval '30 days', "activatedAt"=now(), "activatedBy"='qa-runner', notes='QA verification session', "updatedAt"=now() WHERE id=$1 AND status='PENDING' RETURNING id, status`,
                    [subId]
                  );
                  console.log(`subscription ${subId} → rows updated: ${upd.rowCount}`);
                } else {
                  const upd = await c.query(
                    `UPDATE "Subscription" s SET status='ACTIVE', "startDate"=now(), "endDate"=now()+interval '30 days', "activatedAt"=now(), "activatedBy"='qa-runner', notes='QA verification session', "updatedAt"=now() FROM "User" u WHERE s."userId"=u.id AND u.email=$1 AND s.status='PENDING' RETURNING s.id, s.status`,
                    [QA_EMAIL]
                  );
                  console.log(`QA subscription for ${QA_EMAIL} → rows updated: ${upd.rowCount}`);
                }
                await c.end();
                return; // done on the first app DB
              } catch (e) {
                console.log(`${name}: connect/query failed (${String(e.message).slice(0, 80)})`);
                try { await c.end(); } catch {}
              }
            }
            throw new Error("no candidate database contained the app tables");
          })().catch((e) => { console.error("FATAL", e.message); process.exit(1); });
          EOF
          node qa.js
