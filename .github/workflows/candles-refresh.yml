# Refresh PriceBar candles for the whole market, daily after the EGX close.
#
# Why here and not on Vercel?
#   • Vercel Hobby allows only 2 cron slots (both taken by cron/audit).
#   • Yahoo Finance BLOCKS Vercel Lambda egress (verified 2026-11-13: 100%
#     FETCH_FAILED from production, 200 OK from other IPs) — so the fetch must
#     run from a GitHub runner instead, writing straight to the production DB.
#
# The secret CANDLE_DB_URL holds the production Postgres URL (Supabase).
# The script mirrors src/lib/market/candles.ts conventions exactly: UTC-midnight
# session keys, full-OHLC bars only, bulk upsert ON CONFLICT, 380-session
# retention, and it NEVER writes MarketPrice (TradingView scanner owns it).
#
# Cron timing: EGX closes 14:30 Cairo = 12:30 UTC; Yahoo EOD candles settle
# shortly after — 13:30 UTC (15:30 Cairo) is safely post-close.

name: candles-refresh

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candles-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npx prisma generate

      - name: Refresh candles (incremental — only stale tickers)
        env:
          DATABASE_URL: ${{ secrets.CANDLE_DB_URL }}
        run: node scripts/import-missing-candles.mjs --stale-days=1 --apply --pacing=2000

      - name: Storage stats
        env:
          DATABASE_URL: ${{ secrets.CANDLE_DB_URL }}
        run: node -e "const{PrismaClient}=require('@prisma/client');const db=new PrismaClient();(async()=>{const n=await db.priceBar.count();const last=await db.priceBar.findFirst({orderBy:{ts:'desc'},select:{ts:true}});console.log('total bars:',n,'| latest session:',last&&last.ts.toISOString().slice(0,10));await db.\$disconnect();})()"
