# Intraday alert evaluation while the site is CLOSED — the missing delivery
# piece the owner reported ("التنبيهات ما كانتش بتوصل إلا وأنا فاتح الموقع").
#
# Why here and not on Vercel?
#   • Vercel Hobby allows only 2 cron slots (both taken by cron/audit).
#   • Alerts are evaluated on every successful market-snapshot write (the
#     refresh hook in src/lib/market/refresh.ts) and by the daily 14:00 UTC
#     cron floor. With zero visitors, a price alert that hits at 10:30 Cairo
#     would not be evaluated until ~16:00 Cairo — or never, if the daily cron
#     is the only trigger.
#
# What this does: every 20 minutes during the EGX session (Sun–Thu,
# 08:00–12:59 UTC = 10:00–14:59 Cairo — the same window as the client's 30s
# pulse) it calls:
#   1. GET /api/v1/cron/market   — pulls the public TradingView EGX scanner
#      (the same authorized 15-min-delayed source as every other import; no
#      Yahoo egress involved, so GitHub runners are fine) → writes the snapshot
#      → the refresh hook evaluates ALL active alerts → the Transactional
#      Outbox delivers Web Push inline (seconds).
#   2. GET /api/v1/cron/alerts-push — safety net: drains any outbox jobs the
#      inline dispatch could not finish (retry ladder), then re-evaluates.
#
# Requirements:
#   • Repo secret CRON_SECRET — the same value as the Vercel env CRON_SECRET
#     (both routes 401 without it: "cron disabled unless explicitly configured").
#   • WEB_PUSH_VAPID_PUBLIC_KEY / WEB_PUSH_VAPID_PRIVATE_KEY set in Vercel env
#     (sendPushToUser no-ops without them — check Vercel logs for outbox_job_*).

name: alerts-push

on:
  schedule:
    - cron: "*/20 8-12 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-push
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh snapshot + evaluate alerts (inline web-push dispatch)
        run: |
          code=$(curl -s -o /tmp/market.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/v1/cron/market")
          echo "cron/market → HTTP $code"
          head -c 400 /tmp/market.json; echo
          test "$code" = "200"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://egxano.vercel.app' }}

      - name: Drain outbox (safety net, non-fatal)
        run: |
          code=$(curl -s -o /tmp/push.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/v1/cron/alerts-push")
          echo "cron/alerts-push → HTTP $code"
          head -c 400 /tmp/push.json; echo
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://egxano.vercel.app' }}
